<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Карточки и тесты по экономике предприятия (Ekonomika podniku) на русском и чешском">
<title>Тренажёр по экономике предприятия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a school notebook page on squared paper; index cards for study, Roman numerals = real chapter numbers of the notes */
:root{
  --paper:#f6f7f4;
  --grid:#e3e8ef;
  --ink:#1b2333;
  --muted:#5d6678;
  --line:#d5dae3;
  --card:#ffffff;
  --accent:#2347b8;
  --accent-soft:#e6ebfa;
  --accent-ink:#ffffff;
  --margin:#d9473b;
  --good:#1f7a4d;
  --good-soft:#e2f2e9;
  --bad:#c0392b;
  --bad-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(27,35,51,.06),0 6px 20px rgba(27,35,51,.07);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f;--grid:#1a2030;--ink:#e6e9f0;--muted:#98a1b3;--line:#2a3244;--card:#1a2030;
  --accent:#8aa4ff;--accent-soft:#222c4a;--accent-ink:#0f1424;--margin:#ff7a6b;
  --good:#5fd39a;--good-soft:#173328;--bad:#ff8a7a;--bad-soft:#3a1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f;--grid:#1a2030;--ink:#e6e9f0;--muted:#98a1b3;--line:#2a3244;--card:#1a2030;
  --accent:#8aa4ff;--accent-soft:#222c4a;--accent-ink:#0f1424;--margin:#ff7a6b;
  --good:#5fd39a;--good-soft:#173328;--bad:#ff8a7a;--bad-soft:#3a1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:20px 48px;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:clamp(20px,4.6vw,28px);font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;transition:transform .08s ease,background .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--paper)}
.btn.bad{background:var(--card);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn kbd{font-family:var(--f-mono);font-size:11px;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* overview */
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.summary .stat{display:flex;flex-direction:column;gap:2px}
.summary .stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.summary .stat span{font-size:13px;color:var(--muted)}
.topics{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.topics{grid-template-columns:1fr 1fr}}
.topic{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .1s}
.topic:hover{border-color:var(--accent);transform:translateY(-1px)}
.topic .num{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent);line-height:1;padding-top:2px}
.topic .num small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:6px}
.topic .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.topic h3{font-family:var(--f-body);font-weight:700;font-size:16px}
.topic .cz{font-size:12.5px;color:var(--muted);font-style:italic}
.meter{height:6px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.note{font-size:13px;color:var(--muted)}

/* topic screen */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topic-head{display:flex;flex-direction:column;gap:6px}
.topic-head .tn{font-family:var(--f-mono);font-size:13px;color:var(--accent);letter-spacing:.06em}
.topic-head h2{font-size:clamp(20px,4.4vw,26px)}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* index card */
.deck-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.flip{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-inner{position:relative;display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:260px;padding:34px 22px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(var(--card) 0 31px,var(--grid) 31px 32px);background-position:0 40px}
.face::before{content:"";position:absolute;left:0;right:0;top:28px;height:2px;background:var(--margin);opacity:.75}
.face .tag{position:absolute;top:6px;left:22px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.face.front{justify-content:center;align-items:center;text-align:center}
.face.front .term{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,4.6vw,28px);text-wrap:balance;line-height:1.25}
.face .czterm{font-size:15px;color:var(--muted);font-style:italic}
.face .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted)}
.face.back{transform:rotateY(180deg);justify-content:center}
.face.back .bterm{font-weight:700;color:var(--accent);font-size:15px}
.face.back .def{font-size:17px;line-height:1.6;white-space:pre-line}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{padding-block:14px}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}.topic,.btn{transition:none}}

/* quiz */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.qcard .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.qcard .q{font-size:18px;font-weight:600;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px;color:var(--ink)}
.expl b{color:var(--good)}
.expl b.no{color:var(--bad)}
.progress{height:4px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.result .big{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.mistakes{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mistakes li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.mistakes .ans{color:var(--good);font-weight:600}
footer{font-size:12.5px;color:var(--muted);text-align:center}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<div class="wrap" id="app"></div>

<script>
/* ===== Учебные данные: [термин, чешский термин, определение]; тест: [вопрос, [верный, неверный…], пояснение] ===== */
const TOPICS=[
{id:"1a",num:"I",part:"ч. 1",title:"Основы экономики",cz:"Podstata a fungování tržní ekonomiky",
cards:[
["Экономическая теория","ekonomie","Наука о проблемах хозяйственной жизни: как общества используют редкие ресурсы для производства полезных благ и как распределяют их между группами."],
["Экономика","ekonomika","Практическая отрасль: производство и хозяйствование на предприятии, в домохозяйстве, в государстве и в международном сообществе."],
["Редкость","vzácnost","Ограниченность ресурсов: они ограничены по количеству и исчерпаемы."],
["Микро- и макроэкономика","mikroekonomie / makroekonomie","Микро — поведение отдельных субъектов (домохозяйства, фирмы).\nМакро — экономика в целом (инфляция, безработица)."],
["3 основные проблемы экономики","co, jak, pro koho","ЧТО производить, КАК производить и ДЛЯ КОГО производить."],
["4 экономические системы","ekonomické systémy","Традиционная (обычаи), командная (центральное планирование), рыночная (решает рынок и цены), смешанная (рынок + вмешательство государства)."],
["Экономические субъекты","ekonomické subjekty","Домохозяйства, предприятия, государство.\nДомохозяйство даёт труд и получает зарплату, предприятие продаёт продукцию, государство создаёт законы и собирает налоги."],
["Потребность","potřeba","Врождённое или приобретённое ощущение недостатка, которое человек стремится удовлетворить. Потребности безграничны."],
["Пирамида Маслоу","Maslowova pyramida","Снизу вверх: физиологические → безопасность → принадлежность и любовь → признание → самореализация. Удовлетворяются от низших к высшим."],
["Блага","statky","Полезные средства (обычно продукт труда), которыми удовлетворяем потребности. Они редкие: полезные + ограниченные."],
["Виды благ","druhy statků","Материальные / нематериальные, свободные (воздух, свет) / экономические, потребительские / капитальные, общественные (уличное освещение)."],
["Альтернативные издержки","náklady obětované příležitosti","Ценность второй наилучшей возможности, от которой субъект отказывается ради другой."],
["Граница производственных возможностей","hranice produkčních možností","Показывает максимальный объём продукции, который можно создать из ресурсов государства."],
["Услуги","služby","Деятельность людей для удовлетворения потребностей других.\nВиды: вещественные (ремонт авто), личные (стрижка), платные, бесплатные (полиция)."],
["Уровень жизни","životní úroveň","Степень удовлетворения материальных и духовных потребностей людей + совокупность условий, в которых они удовлетворяются."],
["Факторы производства","výrobní faktory","Природные ресурсы, труд, капитал, информация."],
["Номинальная и реальная зарплата","nominální / reálná mzda","Номинальная — сумма в деньгах.\nРеальная — что работник может купить на эти деньги."],
["Разделение труда","dělba práce","Распределение работы между людьми; основа — специализация.\nЭтапы: естественное → общественное → промышленная революция → международное."],
["Фазы хозяйственного процесса","fáze hospodářského procesu","1) производство, 2) распределение и перераспределение, 3) обмен, 4) потребление."],
["Перераспределение","přerozdělování","Свою долю получают и те, кто не участвовал в производстве (дети, пенсионеры, больные) — через государственные бюджеты."],
["Воспроизводство","reprodukce","Постоянное повторение хозяйственных процессов: простое (тот же объём), расширенное (больше), суженное (меньше)."]
],
quiz:[
["Какие три основные проблемы решает экономика?",["Что, как и для кого производить","Где, когда и сколько производить","Кто, зачем и почём продаёт","Что, где и когда покупать"],"Три основные вопроса: ЧТО, КАК и ДЛЯ КОГО производить."],
["Альтернативные издержки — это…",["ценность второй наилучшей возможности, от которой отказались","сумма всех затрат фирмы за год","затраты на непредвиденные ситуации","издержки на хранение запасов"],"Выбирая одно, мы теряем лучшую из отвергнутых альтернатив — это и есть её ценность."],
["Какая экономическая система была в социалистических странах после Второй мировой войны?",["Командная (централизованно планируемая)","Традиционная","Рыночная","Смешанная"],"Командная система — решения принимает центральный план, а не рынок."],
["Что находится на вершине пирамиды Маслоу?",["Самореализация","Безопасность","Физиологические потребности","Принадлежность и любовь"],"Внизу — физиологические, наверху — самореализация."],
["Что из этого НЕ является фактором производства?",["Потребление","Труд","Капитал","Информация"],"Факторы производства: природные ресурсы, труд, капитал, информация. Потребление — фаза хозяйственного процесса."],
["Реальная заработная плата показывает…",["что работник может купить на полученные деньги","сумму в кронах по договору","зарплату до вычета налогов","зарплату вместе с премиями"],"Номинальная — в деньгах, реальная — покупательная способность."],
["Какую фазу хозяйственного процесса называют «верификатором» всего процесса?",["Обмен","Производство","Потребление","Распределение"],"Обмен проверяет, нужен ли рынку произведённый товар («невидимая рука рынка»)."],
["Расширенное воспроизводство означает…",["более высокий уровень производства","тот же объём производства","более низкий уровень производства","остановку производства"],"Простое — тот же объём, расширенное — больше, суженное — меньше."],
["Воздух, свет и ветер — это блага…",["свободные","экономические","капитальные","общественные"],"Свободные блага доступны без затрат факторов производства."],
["Уличное освещение — пример блага…",["общественного","потребительского","капитального","свободного"],"Общественные блага оплачиваем косвенно — через налоги."]
]},

{id:"1b",num:"I",part:"ч. 2",title:"Рынок, спрос и предложение",cz:"Trh, poptávka, nabídka, konkurence",
cards:[
["Рынок","trh","Место, где встречаются спрос и предложение и происходит купля-продажа."],
["Бартер","barter","Обмен товара на товар без денег. Существует с первобытного общества до сих пор."],
["Субъекты рынка","subjekty trhu","Домохозяйства (покупают блага, продают факторы производства), фирмы (продают продукцию, покупают факторы), государство (влияет на рынок)."],
["Виды рынка","druhy trhu","По товарам: частичный / агрегированный.\nПо территории: местный / национальный / международный.\nПо предмету: товаров и услуг / факторов производства / финансовый."],
["Спрос","poptávka","Готовность и способность покупателей купить определённое количество товара по определённой цене."],
["Предложение","nabídka","Готовность и способность продавцов предложить определённое количество товара по определённой цене."],

["Jakou roli má obchod?",["Zprostředkovává mezi výrobou a spotřebou","Vyrábí suroviny","Vybírá daně","Reguluje ceny"],"Obchod zajišťuje oběh zboží."]
]},

"6":{title:"Dlouhodobý majetek a odpisy",
cards:[
["Dlouhodobý majetek","Používá se delší dobu, neztrácí hodnotu najednou, ale postupně se opotřebovává."],
["Ocenění dlouhodobého majetku","Pořizovací cena – kupní cena + doprava, montáž.\nVlastní náklady – při vlastní výrobě.\nReprodukční cena – kolik stojí dnes (např. při daru)."],
["Technické zhodnocení","Výdaje na modernizaci, která zlepší vlastnosti, nad 80 000 Kč. O tuto částku se zvyšuje vstupní cena."],
["Hmotný dlouhodobý majetek","Doba použitelnosti delší než 1 rok a vstupní cena vyšší než 80 000 Kč. Věci movité a nemovité."],
["Nehmotný a finanční majetek","Nehmotný – licence, patenty, software (déle než 1 rok).\nFinanční – vlastníme déle než 1 rok kvůli výnosům (úroky, nájem)."],
["Drobný majetek","Slouží déle než 1 rok, ale je levnější než limit (notebooky, tiskárny). Zařazení určí podnikatel."],
["Operativní leasing a pacht","Leasing – dlouhodobý nájem, věc zůstává pronajímateli, v nájemném je servis a pojištění.\nPacht – nájem, kdy nájemce získává z věci výnosy."],
["Fyzické a morální opotřebení","Fyzické – věc se opotřebovává (klesá přesnost, opravy).\nMorální – zastarává, objeví se něco lepšího."],
["Odpis, oprávky, zůstatková cena","Odpis – částka pravidelného snížení vstupní ceny.\nOprávky – součet odpisů za dobu.\nZůstatková cena – vstupní cena minus oprávky."],
["Účetní a daňové odpisy","Účetní – skutečné opotřebení, podle zákona o účetnictví.\nDaňové – podle zákona o daních z příjmů, 6 odpisových skupin."],
["Vzorce účetních odpisů","Odpisová sazba v % = 100 / doba životnosti\nRoční odpis = (vstupní cena / 100) × odpisová sazba"],
["Rovnoměrné a zrychlené odpisy","Rovnoměrné – každý rok stejně, 1. rok méně.\nZrychlené – na začátku nejvyšší (kromě 1. roku). Zaokrouhlujeme na celé Kč nahoru."],
["Odpisové skupiny","1 – počítače, nářadí: 3 roky\n2 – stroje, automobily: 5 let\n3 – parní kotle, tramvaje: 10 let\n4 – věže, plynovody: 20 let\n5 – průmyslové budovy, byty: 30 let\n6 – administrativní budovy, hotely: 50 let"],
["Vzorce zrychleného odpisu","1. rok = vstupní cena / koeficient pro 1. rok\nDalší roky = (2 × ZC) / (k − n)\nk – koeficient, n – počet let, po které se již odpisovalo"]
],
quiz:[
["Od jaké ceny patří majetek do hmotného dlouhodobého majetku?",["Nad 80 000 Kč","Nad 40 000 Kč","Nad 1 000 000 Kč","Při jakékoli ceně"],"A doba použitelnosti musí být delší než 1 rok."],
["Počítače patří do odpisové skupiny…",["1 (3 roky)","2 (5 let)","3 (10 let)","6 (50 let)"],"Počítače a kancelářská technika – 1. skupina."],
["Osobní a nákladní automobily jsou ve skupině…",["2 (5 let)","1 (3 roky)","4 (20 let)","5 (30 let)"],"Většina strojů a automobilů – 2. skupina."],
["Zůstatková cena je…",["vstupní cena minus oprávky","součet všech odpisů","cena při prodeji do šrotu","roční odpis"],"Na začátku se rovná vstupní ceně, na konci je nulová."],
["Morální opotřebení je…",["zastarání (objeví se dokonalejší technika)","porucha stroje","opadaná omítka","krádež majetku"],"Fyzické opotřebení je hmotné opotřebení věci."],
["Jak se zaokrouhlují daňové odpisy?",["Na celé koruny nahoru","Na stovky korun","Dolů","Nezaokrouhlují se"],"Podle zápisu: zaokrouhlujeme na celé Kč nahoru."],
["Účetní odpisová sazba při době životnosti 5 let:",["20 %","5 %","50 %","25 %"],"100 / 5 = 20 %."],
["Notebook za 30 000 Kč s životností 3 roky je…",["drobný majetek","hmotný dlouhodobý majetek","nehmotný majetek","finanční majetek"],"Slouží déle než rok, ale je levnější než limit 80 000 Kč."],
["Při operativním leasingu věc…",["zůstává v majetku pronajímatele","hned přechází na nájemce","se prodá","se vyřadí"],"Nájemce ji jen používá a platí nájemné."]
]},

"7":{title:"Investice, oběžný majetek, zásoby",
cards:[
["Způsoby vyřazení majetku","Prodej, dar, přeřazení do osobního užívání, likvidace (šrot, demolice). Rozhoduje management."],
["Doklady evidence majetku","Zápis o převzetí → karta dlouhodobého majetku (inventární číslo, odpisy) → zápis o vyřazení."],
["Výnosnost a rizikovost","Jsou protikladné: výnosná investice bývá riskantní, bezpečná přináší malý výnos."],
["ROI","Return on investment = čistý roční zisk z investice / pořizovací náklad investice. Kolik Kč zisku přinese každá vložená koruna."],
["Doba návratnosti","Za kolik let se investice splatí z čistého zisku. Neměla by být delší než doba životnosti."],
["Oběžný majetek","Používá se jednorázově, v koloběhu mění podobu:\npeníze → materiál → výrobky → pohledávka → peníze."],
["Druhy oběžného majetku","Krátkodobý finanční (peníze, ceniny, cenné papíry do 1 roku), pohledávky, zásoby."],
["Složky zásob","Materiál, polotovary, nedokončená výroba, výrobky, zboží."],
["Polotovar a nedokončená výroba","Polotovar – už zpracovaný, ale bez dalšího zpracování nepoužitelný (knedlík v prášku).\nNedokončená výroba – prošla operacemi, ale není výrobkem (vytištěný nesvázaný papír)."],
["Bilance materiálu","Nákup = spotřeba + konečná zásoba − počáteční zásoba\nPlánovaná spotřeba = norma spotřeby × plánovaná produkce"],
["Optimální zásoba","Váže přijatelné množství peněz a vyvolává co nejmenší náklady na pořízení, skladování a plynulou výrobu."],
["Běžná, pojistná, technická zásoba","Běžná – vydává se do výroby.\nPojistná – rezerva pro výpadek dodávky.\nTechnická – materiál je třeba před použitím upravit."],
["Minimální zásoba","Pod ni by stav neměl klesnout – je čas objednat.\n= dodací lhůta × průměrná denní spotřeba + pojistná zásoba"],
["Maximální zásoba","Nad ni by stav neměl stoupnout.\n= (dodávkový cyklus + dodací lhůta) × průměrná denní spotřeba + pojistná zásoba\nNákup = maximální zásoba − aktuální zásoba"],
["Doklady při nákupu","Dodací list (s materiálem), faktura, příjemka (kontrola), protokol o vadách, karta zásob, výdejka (výdej)."],
["Metody řízení zásob","ABC – skupiny A (60–80 % spotřeby), B, C (max. 5 %).\nMRP – výpočet přesného množství pro finální produkt.\nJust in time – dodávka přesně, když je potřeba.\nKanban – výroba podle známých objednávek."],
["Rychlost obratu zásob","Počet obrátek = celková spotřeba / průměrná zásoba\nDoba obratu = 360 dní / počet obrátek\nRychlejší obrat → vyšší zisk, méně potřebných peněz."]
],
quiz:[
["Jak se počítá ROI?",["Čistý roční zisk / pořizovací náklad investice","Náklady / zisk","Tržby − náklady","Zisk × doba životnosti"],"Ukazuje, kolik Kč zisku přinese každá vložená koruna."],
["Která metoda znamená dodávku přesně v okamžiku potřeby?",["Just in time","ABC","Kanban","MRP"],"Kanban – výroba podle přesně známých objednávek."],
["Skupina A v metodě ABC jsou…",["nejpoužívanější položky (60–80 % spotřeby)","nejlevnější položky","položky do 5 % spotřeby","vadný materiál"],"Skupina C tvoří max. 5 % spotřeby."],
["Minimální zásoba = …",["dodací lhůta × průměrná denní spotřeba + pojistná zásoba","dodávkový cyklus × spotřeba","maximální − aktuální zásoba","spotřeba / průměrná zásoba"],"Při tomto množství je třeba objednat další dodávku."],
["Nákup = …",["spotřeba + konečná zásoba − počáteční zásoba","spotřeba − konečná zásoba","počáteční + konečná zásoba","norma × spotřeba"],"Bilance materiálu: zdroje = potřeba."],
["Zásoba pro případ výpadku dodávky se nazývá…",["pojistná","běžná","technická","maximální"],"Stanoví se podle statistických odhadů."],
["Vytištěný, ale nesvázaný papír v tiskárně je…",["nedokončená výroba","polotovar","výrobek","zboží"],"Prošel výrobními operacemi, ale ještě není výrobkem."],
["Doba obratu zásob = …",["360 dní / počet obrátek","počet obrátek / 360","průměrná zásoba × 360","spotřeba / 12"],"Čím kratší doba, tím rychleji se peníze vracejí do firmy."],
["Co platí o výnosnosti a riziku?",["Jsou protikladné: výnosné bývá riskantní","Čím vyšší výnos, tím nižší riziko","Nesouvisejí spolu","Bezpečné investice jsou nejvýnosnější"],"Je třeba hledat kompromis."]
]},

"8":{title:"Zaměstnanci a pracovní poměr",
cards:[
["Výběr a nábor","Výběr – zjištění konkrétních pracovních pozic.\nNábor – přilákat dost vhodných uchazečů včas a s přiměřenými náklady."],
["Výkonová norma času a množství","Norma času – čas na jednotku výroby.\nNorma množství – kolik výrobků za jednotku času."],
["Výpočet počtu zaměstnanců","Počet zaměstnanců = celkový potřebný čas / celkový pracovní čas 1 zaměstnance"],
["Řešení přebytku zaměstnanců","Snížení úvazků, předčasné odchody do důchodu, dobrovolné odchody."],

["Smlouva na dobu určitou a zkušební doba","Na dobu určitou – maximálně 3× za sebou.\nZkušební doba – max. 4 měsíce (vedoucí 8)."],

["Superdávka","Nahradila 4 dávky: přídavek na dítě, příspěvek na bydlení, příspěvek na živobytí a doplatek na bydlení. 1. výplata – květen 2026."],

"14":{title:"Náklady, výnosy, zisk a ceny",
cards:[
["Náklady","Peněžní vyjádření spotřeby věcných prostředků a práce."],
["Fixní a variabilní náklady","Fixní – nemění se s objemem výroby (nájem).\nVariabilní – závisí na objemu výroby (materiál)."],
["Celkové, mezní, průměrné náklady","Celkové = fixní + variabilní.\nMezní – na 1 jednotku navíc.\nPrůměrné – celkové náklady na jednotku."],
["Přímé a nepřímé (režijní) náklady","Přímé – lze spočítat na jednici (materiál, úkolová mzda).\nNepřímé – nelze přesně přiřadit (řízení firmy, propagace značky)."],
["Explicitní a implicitní náklady","Explicitní – firma je reálně platí penězi.\nImplicitní – za vlastní zdroje (vlastní stroje, budovy, vlastní práce)."],
["Účetní náklady","Provozní (materiál, mzdy), finanční (úroky, kurzy), mimořádné (škody, manka)."],
["Krycí příspěvek","Tržby − variabilní náklady. Nejdřív kryje fixní náklady, pak tvoří zisk."],
["Bod zvratu","Minimální objem prodeje, který pokryje všechny náklady.\nBZ = fixní náklady / (cena − variabilní náklady na 1 ks)"],
["Výnosy","Oceněné výkony podnikání. Hlavní částí jsou tržby (hrubé a čisté = hrubé − slevy, reklamace)."],
["Rentabilita tržeb","Zisk před zdaněním / tržby × 100 – kolik % zisku přinášejí tržby."],
["Výsledek hospodaření","Výnosy − náklady za období. Výnosy > náklady → zisk, jinak ztráta. Je ve výkazu zisku a ztráty."],
["Druhy zisku postupně","Hrubý = tržby − náklady na prodané zboží\nEBIT = hrubý zisk − provozní náklady\nEBT = EBIT − úroky\nČistý = EBT − daň z příjmu"],
["Ekonomický zisk","Účetní zisk − oportunitní náklady. Když je 0, firma pokryla všechny náklady včetně alternativních."],
["Nerozdělený zisk","Část čistého zisku, která se nevyplácí jako dividendy, ale zůstává ve firmě na rozvoj."],

const L=()=>UI[S.lang]||UI.ru;
const isCz=()=>S.lang==="cz";
const ck=(t,i)=>t+":"+i;
const byId=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
/* название темы и подпись на втором языке */
const tTitle=t=>isCz()?CZ[t.id].title:t.title;
const tAlt=t=>isCz()?t.title:t.cz;
/* карточка: лицевая сторона, подпись на втором языке, определение */
function cardOf(tid,i){const c=byId[tid].cards[i];
  if(isCz()){const z=CZ[tid].cards[i];return{front:z[0],alt:c[0],def:z[1]}}
  return{front:c[0],alt:c[1],def:c[2]}}
const quizOf=(tid,i)=>isCz()?CZ[tid].quiz[i]:byId[tid].quiz[i];
const knownCount=t=>t.cards.reduce((n,_,i)=>n+(S.known[ck(t.id,i)]?1:0),0);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const app=document.getElementById("app");
let keyHandler=null;
document.addEventListener("keydown",e=>{if(keyHandler&&!e.metaKey&&!e.ctrlKey&&!e.altKey)keyHandler(e)});
function plural(n,[a,b,c]){if(isCz())return n===1?a:(n>=2&&n<=4?b:c);n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function setLangAttr(){document.documentElement.lang=isCz()?"cs":"ru"}
/* тема: auto — как в системе, light / dark — выбор пользователя */
function applyTheme(){const r=document.documentElement;if(S.theme==="light"||S.theme==="dark")r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme")}
const THEMES={ru:{auto:"Авто",light:"Светлая",dark:"Тёмная",lbl:"Тема"},cz:{auto:"Auto",light:"Světlý",dark:"Tmavý",lbl:"Motiv"}};

function header(){
  return `<header class="top">
    <div class="brand"><span class="eyebrow">Ekonomika podniku</span><h1>${L().brand}</h1></div>
    <div class="row">
      <div class="lang" role="group" aria-label="Язык / Jazyk">
        <button data-lang="ru" aria-pressed="${!isCz()}">RU</button>
        <button data-lang="cz" aria-pressed="${isCz()}">CZ</button>
      </div>
      <div class="lang" role="group" aria-label="${THEMES[S.lang].lbl}">
        ${["auto","light","dark"].map(k=>`<button data-theme-set="${k}" aria-pressed="${S.theme===k}">${k==="light"?"☀ ":k==="dark"?"☾ ":""}${THEMES[S.lang][k]}</button>`).join("")}
      </div>
      <label class="toggle" for="czToggle"><input type="checkbox" id="czToggle" ${S.cz?"checked":""}> ${L().alt}</label>
    </div>
  </header>`;
}
function bindHeader(rerender){
  const c=document.getElementById("czToggle");
  c.addEventListener("change",()=>{S.cz=c.checked;save();rerender()});
  app.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
    if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();setLangAttr();rerender()}));
  app.querySelectorAll("[data-theme-set]").forEach(b=>b.addEventListener("click",()=>{
    S.theme=b.dataset.themeSet;save();applyTheme();
    app.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
}

/* ===== Главный экран ===== */
function home(){
  keyHandler=null;const l=L();
  const totalCards=TOPICS.reduce((n,t)=>n+t.cards.length,0);
  const totalKnown=TOPICS.reduce((n,t)=>n+knownCount(t),0);
  const totalQ=TOPICS.reduce((n,t)=>n+t.quiz.length,0);
  const tested=TOPICS.filter(t=>S.best[t.id]!=null).length;
  app.innerHTML=header()+`
  <section class="summary">
    <div class="stat"><b>${totalKnown} / ${totalCards}</b><span>${l.known}</span></div>
    <div class="stat"><b>${tested} / ${TOPICS.length}</b><span>${l.tested}</span></div>
    <div class="row">
      <button class="btn primary" id="mixCards">${l.mix}</button>
      <button class="btn" id="mixQuiz">${l.mixQuiz}</button>
    </div>
  </section>
  <p class="note">${l.intro}</p>
  <section class="topics">
    ${TOPICS.map(t=>{const k=knownCount(t),p=Math.round(k/t.cards.length*100),b=S.best[t.id];
      return `<button class="topic" data-id="${t.id}">
        <span class="num">${t.num}${t.part?`<small>${isCz()?t.part.replace("ч.","č."):t.part}</small>`:""}</span>
        <span class="body">
          <h3>${esc(tTitle(t))}</h3>
          ${S.cz?`<span class="cz">${esc(tAlt(t))}</span>`:""}
          <span class="meter" aria-hidden="true"><i style="width:${p}%"></i></span>
          <span class="meta"><span>${k}/${t.cards.length} ${l.cardsOf}</span>
          ${b!=null?`<span class="chip ${b===t.quiz.length?"good":""}">${l.test}: ${b}/${t.quiz.length}</span>`:`<span>${t.quiz.length} ${plural(t.quiz.length,l.q)}</span>`}</span>
        </span>
      </button>`}).join("")}
  </section>
  <footer>${l.foot(TOPICS.length,totalCards,totalQ)}</footer>`;
  bindHeader(home);
  app.querySelectorAll(".topic").forEach(b=>b.addEventListener("click",()=>topic(b.dataset.id,"cards")));
  document.getElementById("mixCards").addEventListener("click",()=>{
    let items=[];TOPICS.forEach(t=>t.cards.forEach((_,i)=>{if(!S.known[ck(t.id,i)])items.push([t.id,i])}));
    let all=false;if(!items.length){all=true;TOPICS.forEach(t=>t.cards.forEach((_,i)=>items.push([t.id,i])))}
    cardSession(null,shuffle(items).slice(0,30),all);
  });
  document.getElementById("mixQuiz").addEventListener("click",()=>{
    let items=[];TOPICS.forEach(t=>t.quiz.forEach((_,i)=>items.push([t.id,i])));
    quizSession(null,shuffle(items).slice(0,20));
  });
  window.scrollTo(0,0);
}

/* ===== Экран темы ===== */
const partLbl=p=>isCz()?p.replace("ч.","č."):p;
function topicShell(t,tab){const l=L();
  return header()+`
  <nav class="crumbs"><button class="btn ghost" id="back">${l.back}</button></nav>
  <div class="topic-head">
    <span class="tn">${t?`${l.topic} ${t.num}${t.part?" · "+partLbl(t.part):""}`:l.allTopics}</span>
    <h2>${t?esc(tTitle(t)):l.mixTitle}</h2>
    ${t&&S.cz?`<span class="note"><i>${esc(tAlt(t))}</i></span>`:""}
  </div>
  ${t?`<div class="tabs" role="tablist">
    <button role="tab" aria-selected="${tab==="cards"}" data-tab="cards">${l.tCards}</button>
    <button role="tab" aria-selected="${tab==="quiz"}" data-tab="quiz">${l.tQuiz}</button>
  </div>`:""}
  <div id="stage" style="display:flex;flex-direction:column;gap:16px"></div>`;
}
function bindShell(t,rerender){
  bindHeader(rerender);
  document.getElementById("back").addEventListener("click",home);
  app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>topic(t.id,b.dataset.tab)));
}
function topic(id,tab){
  const t=byId[id];
  if(tab==="cards"){
    let items=t.cards.map((_,i)=>[id,i]).filter(([a,i])=>!S.known[ck(a,i)]);
    let all=false;if(!items.length){all=true;items=t.cards.map((_,i)=>[id,i])}
    cardSession(t,shuffle(items),all);
  }else{
    quizSession(t,shuffle(t.quiz.map((_,i)=>[id,i])));
  }
}

/* ===== Карточки ===== */
function cardSession(t,items,allMode){
  let queue=items.slice(),flipped=false,learned=0,again=0;
  const total=items.length;
  const draw=()=>{const l=L();
    app.innerHTML=topicShell(t,"cards");
    bindShell(t,draw);
    const st=document.getElementById("stage");
    if(!queue.length){
      const tk=t?knownCount(t):null;
      st.innerHTML=`<div class="result">
        <span class="tn note">${l.done}</span>
        <div class="big">${learned} / ${total}</div>
        <p>${l.doneTxt}${t?l.inTopic(tk,t.cards.length):""}</p>
        <div class="row">
          ${t?`<button class="btn primary" id="toQuiz">${l.toQuiz}</button>`:""}
          <button class="btn" id="restart">${l.restart}</button>
          ${t&&tk>0?`<button class="btn ghost" id="reset">${l.reset}</button>`:""}
        </div></div>`;
      t&&document.getElementById("toQuiz").addEventListener("click",()=>topic(t.id,"quiz"));
      document.getElementById("restart").addEventListener("click",()=>{
        const its=t?t.cards.map((_,i)=>[t.id,i]):items;cardSession(t,shuffle(its),true)});
      const r=document.getElementById("reset");
      r&&r.addEventListener("click",()=>{t.cards.forEach((_,i)=>delete S.known[ck(t.id,i)]);save();topic(t.id,"cards")});
      keyHandler=null;return;
    }
    const [tid,ci]=queue[0];const tp=byId[tid];const c=cardOf(tid,ci);
    const lab=`${tp.num}${tp.part?" "+partLbl(tp.part):""}`;
    const done=total-queue.length;
    st.innerHTML=`
      <div class="deck-bar"><span>${allMode?l.allMode:l.newMode} · ${l.left} ${queue.length}</span><span>${l.kn}: ${learned} · ${l.ag}: ${again}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${Math.round(done/total*100)}%"></i></div>
      <div class="flip ${flipped?"on":""}" id="flip" tabindex="0" role="button" aria-label="${l.flipLbl}">
        <div class="flip-inner">
          <div class="face front">
            <span class="tag">${lab} · ${l.term}</span>
            <div class="term">${esc(c.front)}</div>
            ${S.cz?`<div class="czterm">${esc(c.alt)}</div>`:""}
            <div class="hint">${l.hint}</div>
          </div>
          <div class="face back">
            <span class="tag">${lab} · ${l.defn}</span>
            <div class="bterm">${esc(c.front)}${S.cz?` <span class="czterm">· ${esc(c.alt)}</span>`:""}</div>
            <div class="def">${esc(c.def)}</div>
          </div>
        </div>
      </div>
      <div class="actions" ${flipped?"":"hidden"} id="acts">
        <button class="btn bad" id="again"><kbd>1</kbd> ${l.nope}</button>
        <button class="btn good" id="know"><kbd>2</kbd> ${l.yes}</button>
      </div>
      ${flipped?"":`<button class="btn primary" id="show">${l.show}</button>`}`;
    const flip=()=>{flipped=!flipped;document.getElementById("flip").classList.toggle("on",flipped);
      document.getElementById("acts").hidden=!flipped;const s=document.getElementById("show");if(s)s.remove()};
    document.getElementById("flip").addEventListener("click",flip);
    const sh=document.getElementById("show");sh&&sh.addEventListener("click",flip);
    const know=()=>{S.known[ck(tid,ci)]=1;save();learned++;queue.shift();flipped=false;draw()};
    const nope=()=>{delete S.known[ck(tid,ci)];save();again++;const it=queue.shift();queue.splice(Math.min(3,queue.length),0,it);flipped=false;draw()};
    document.getElementById("know").addEventListener("click",know);
    document.getElementById("again").addEventListener("click",nope);
    keyHandler=e=>{
      if(e.target.tagName==="INPUT")return;
      if(e.key===" "||e.key==="Enter"){if(e.target.tagName==="BUTTON"&&e.target.id!=="flip")return;e.preventDefault();flip()}
      else if(flipped&&(e.key==="2"||e.key==="ArrowRight"))know();
      else if(flipped&&(e.key==="1"||e.key==="ArrowLeft"))nope();
    };
  };
  draw();window.scrollTo(0,0);
}

/* ===== Тест: тексты берутся при каждой отрисовке, поэтому язык можно сменить посреди теста ===== */
function quizSession(t,items){
  const qs=items.map(([tid,qi])=>({tid,qi,order:shuffle([0,1,2,3])}));
  let idx=0,score=0,picked=null;const wrong=[];
  const draw=()=>{const l=L();
    app.innerHTML=topicShell(t,"quiz");
    bindShell(t,draw);
    const st=document.getElementById("stage");
    if(idx>=qs.length){
      if(t){const prev=S.best[t.id];if(prev==null||score>prev){S.best[t.id]=score;save()}}
      const pct=Math.round(score/qs.length*100);
      const verdict=pct===100?l.v100:pct>=80?l.v80:pct>=50?l.v50:l.v0;
      st.innerHTML=`<div class="result">
        <span class="tn note">${l.res}</span>
        <div class="big">${score} / ${qs.length}</div>
        <p>${verdict}${t&&S.best[t.id]!=null?l.best(S.best[t.id],t.quiz.length):""}</p>
        ${wrong.length?`<h3 style="font-family:var(--f-body);font-size:16px">${l.mist}</h3><ul class="mistakes">${wrong.map(w=>{const d=quizOf(w.tid,w.qi);
          return `<li><span>${esc(d[0])}</span><span class="ans">✓ ${esc(d[1][0])}</span><span class="note">${esc(d[2])}</span></li>`}).join("")}</ul>`:""}
        <div class="row">
          ${wrong.length?`<button class="btn primary" id="retryWrong">${l.retryW}</button>`:""}
          <button class="btn" id="retry">${l.retry}</button>
          ${t?`<button class="btn ghost" id="toCards">${l.toCards}</button>`:""}
        </div></div>`;
      const rw=document.getElementById("retryWrong");
      rw&&rw.addEventListener("click",()=>quizSession(t,wrong.map(w=>[w.tid,w.qi])));
      document.getElementById("retry").addEventListener("click",()=>quizSession(t,shuffle(items)));
      const tc=document.getElementById("toCards");tc&&tc.addEventListener("click",()=>topic(t.id,"cards"));
      keyHandler=null;return;
    }
    const q=qs[idx];const tp=byId[q.tid];const d=quizOf(q.tid,q.qi);
    st.innerHTML=`
      <div class="deck-bar"><span>${l.qOf(idx+1,qs.length)}</span><span>${l.right}: ${score}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${Math.round(idx/qs.length*100)}%"></i></div>
      <div class="qcard">
        <span class="qn">${l.topic} ${tp.num}${tp.part?" "+partLbl(tp.part):""}</span>
        <div class="q">${esc(d[0])}</div>
        <div class="opts">${q.order.map((oi,i)=>{let cls="";if(picked!=null){if(oi===0)cls="right";else if(i===picked)cls="wrong"}
          return `<button class="opt ${cls}" data-i="${i}" ${picked!=null?"disabled":""}><span class="k">${i+1}</span><span>${esc(d[1][oi])}</span></button>`}).join("")}</div>
        ${picked!=null?`<div class="expl">${q.order[picked]===0?`<b>${l.ok}</b> `:`<b class="no">${l.bad}</b> `}${esc(d[2])}</div>
        <button class="btn primary" id="next" style="align-self:flex-start">${idx+1<qs.length?l.next:l.result} <kbd>Enter</kbd></button>`:""}
      </div>`;
    const pick=i=>{if(picked!=null)return;picked=i;
      if(q.order[i]===0)score++;else wrong.push({tid:q.tid,qi:q.qi});draw();
      const n=document.getElementById("next");n&&n.focus()};
    st.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.i)));
    const next=()=>{idx++;picked=null;draw();window.scrollTo(0,0)};
    const nb=document.getElementById("next");nb&&nb.addEventListener("click",next);
    keyHandler=e=>{
      if(e.target.tagName==="INPUT")return;
      if(picked==null&&/^[1-4]$/.test(e.key))pick(+e.key-1);
      else if(picked!=null&&e.key==="Enter"&&e.target.id!=="next"){e.preventDefault();next()}
    };
  };
  draw();window.scrollTo(0,0);
}

setLangAttr();
applyTheme();
home();
</script>
</body>
</html>
